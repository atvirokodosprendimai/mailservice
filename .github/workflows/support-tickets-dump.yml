name: Support Tickets Dump

on:
  workflow_dispatch:
    inputs:
      clear_session_mailbox_id:
        description: "Optional mailbox UUID — if set, clears stripe_session_id and payment_url on that row inside a transaction; commits only if exactly 1 row matched."
        required: false
        default: ""

permissions: { contents: read }

jobs:
  dump:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      CLEAR_SESSION_MAILBOX_ID: ${{ github.event.inputs.clear_session_mailbox_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Dump support_messages
        run: |
          cat > /tmp/dump.go <<'EOF'
          package main
          import (
            "context"
            "fmt"
            "log"
            "os"
            "github.com/atvirokodosprendimai/mailservice/internal/platform/database"
          )
          func main() {
            db, err := database.OpenTurso(os.Getenv("TURSO_DATABASE_URL"), os.Getenv("TURSO_AUTH_TOKEN"))
            if err != nil { log.Fatal(err) }
            sqlDB, err := db.DB()
            if err != nil { log.Fatal(err) }
            defer sqlDB.Close()
            ctx := context.Background()

            var total int64
            sqlDB.QueryRowContext(ctx, "SELECT COUNT(*) FROM support_messages").Scan(&total)
            fmt.Printf("total support_messages: %d\n\n", total)

            rows, err := sqlDB.QueryContext(ctx, `SELECT id, mailbox_id, key_fingerprint, subject, body, created_at FROM support_messages ORDER BY created_at DESC LIMIT 100`)
            if err != nil { log.Fatal(err) }
            defer rows.Close()
            for rows.Next() {
              var id, mbid, fp, subj, body string
              var created interface{}
              rows.Scan(&id, &mbid, &fp, &subj, &body, &created)
              fmt.Printf("---\nid=%s\nmailbox=%s\nfp=%s\ncreated=%v\nsubject=%s\nbody=%s\n", id, mbid, fp, created, subj, body)
            }
            rows.Close()

            target := os.Getenv("CLEAR_SESSION_MAILBOX_ID")
            if target == "" {
              fmt.Println("\nno CLEAR_SESSION_MAILBOX_ID set, skipping update")
              return
            }
            fmt.Printf("\n=== UPDATE pass for mailbox id=%s ===\n", target)
            tx, err := sqlDB.BeginTx(ctx, nil)
            if err != nil { log.Fatal(err) }
            var pre struct{ id, sid, url, status string; paid interface{} }
            err = tx.QueryRowContext(ctx, "SELECT id, stripe_session_id, payment_url, status, paid_at FROM mailboxes WHERE id = ?", target).Scan(&pre.id, &pre.sid, &pre.url, &pre.status, &pre.paid)
            if err != nil { tx.Rollback(); log.Fatal("pre-select: ", err) }
            fmt.Printf("BEFORE: status=%s paid_at=%v\n  session_id=%s\n  url=%s\n", pre.status, pre.paid, pre.sid, pre.url)
            res, err := tx.ExecContext(ctx, "UPDATE mailboxes SET stripe_session_id='', payment_url='', updated_at=CURRENT_TIMESTAMP WHERE id = ?", target)
            if err != nil { tx.Rollback(); log.Fatal("update: ", err) }
            n, _ := res.RowsAffected()
            fmt.Printf("rows affected: %d\n", n)
            if n != 1 {
              tx.Rollback()
              log.Fatalf("expected exactly 1 row, got %d — rolled back, no change", n)
            }
            var post struct{ sid, url string }
            err = tx.QueryRowContext(ctx, "SELECT stripe_session_id, payment_url FROM mailboxes WHERE id = ?", target).Scan(&post.sid, &post.url)
            if err != nil { tx.Rollback(); log.Fatal("post-select: ", err) }
            fmt.Printf("AFTER (uncommitted): session_id=%q url=%q\n", post.sid, post.url)
            if err := tx.Commit(); err != nil { log.Fatal("commit: ", err) }
            fmt.Println("COMMITTED")
          }
          EOF
          mkdir -p cmd/dump && mv /tmp/dump.go cmd/dump/main.go
          go run ./cmd/dump
