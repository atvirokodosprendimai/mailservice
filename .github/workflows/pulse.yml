name: Pulse Report

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency: { group: pulse, cancel-in-progress: true }

permissions: { contents: read }

jobs:
  pulse:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CGO_ENABLED: "0"
      TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      POLAR_PULSE_TOKEN: ${{ secrets.POLAR_PULSE_TOKEN }}
      POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      PUBLIC_BASE_URL: https://truevipaccess.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build -o bin/pulse ./cmd/pulse

      - run: ./bin/pulse --window 24h --out docs/pulse-reports/

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-report
          path: docs/pulse-reports/*.md
          retention-days: 90

      - name: Email pulse report via Mailgun
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_BASE_URL: ${{ vars.MAILGUN_BASE_URL }}
          MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
          MAILGUN_FROM_EMAIL: ${{ vars.MAILGUN_FROM_EMAIL }}
          MAILGUN_FROM_NAME: ${{ vars.MAILGUN_FROM_NAME }}
          PULSE_EMAIL_TO: ${{ vars.PULSE_EMAIL_TO }}
        run: |
          set -euo pipefail
          REPORT="$(ls -1t docs/pulse-reports/*.md | head -1)"
          if [ -z "$REPORT" ]; then
            echo "no pulse report markdown found" >&2
            exit 1
          fi
          SUBJECT="Pulse $(basename "$REPORT" .md)"
          curl -sS --fail --user "api:${MAILGUN_API_KEY}" \
            "${MAILGUN_BASE_URL}/v3/${MAILGUN_DOMAIN}/messages" \
            -F from="${MAILGUN_FROM_NAME} <${MAILGUN_FROM_EMAIL}>" \
            -F to="${PULSE_EMAIL_TO}" \
            -F subject="${SUBJECT}" \
            -F text="<${REPORT}"
