name: Periodic Smoke Test

on:
  workflow_call:
    inputs:
      checkout_only:
        type: string
        required: false
        default: "true"
  workflow_dispatch:
    inputs:
      checkout_only:
        description: "Enable checkout-only mode (no payment)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  healthz-production:
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Production health check
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${BASE_URL}/healthz")
          if [ "$status" != "200" ]; then
            echo "FAIL: production healthz returned HTTP $status" >&2
            exit 1
          fi
          echo "OK: production healthz returned 200"
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

  smoke-checkout:
    if: inputs.checkout_only == 'true' || github.event.inputs.checkout_only == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: smoke
    timeout-minutes: 6
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run smoke test (checkout only)
        run: ops/smoke-test-periodic.sh --verbose --checkout-only
        env:
          SMOKE_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          SMOKE_BILLING_EMAIL: ${{ vars.SMOKE_BILLING_EMAIL }}
          SMOKE_IMAP_HOST: ${{ vars.IMAP_HOST }}
          SMOKE_IMAP_PORT: "993"
