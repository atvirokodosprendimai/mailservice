name: Polar Discover Org

on:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  discover:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: List Polar organizations
        env:
          POLAR_PULSE_TOKEN: ${{ secrets.POLAR_PULSE_TOKEN }}
        run: |
          set -e
          curl -sS -w '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer $POLAR_PULSE_TOKEN" \
            https://api.polar.sh/v1/organizations/
