name: Pulse Debug Drift

on:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  debug:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      POLAR_PULSE_TOKEN: ${{ secrets.POLAR_PULSE_TOKEN }}
      POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID }}
      TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Polar subscriptions dump
        run: |
          set -euo pipefail
          curl -sS \
            -H "Authorization: Bearer $POLAR_PULSE_TOKEN" \
            "https://api.polar.sh/v1/subscriptions/?organization_id=$POLAR_ORGANIZATION_ID&limit=100" \
            | jq '.items[] | {id, status, customer_email: .customer.email, product_id, created_at, current_period_end, cancel_at_period_end, ended_at}'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Recovery dry-run (BEGIN; UPDATE; SELECT diff; ROLLBACK;)
        run: |
          cat > /tmp/dryrun.go <<'EOF'
          package main
          import (
            "context"
            "fmt"
            "log"
            "os"
            "github.com/atvirokodosprendimai/mailservice/internal/platform/database"
          )
          const dropIndex = `DROP INDEX IF EXISTS idx_mailboxes_billing_email_active;`
          const recovery = `
          UPDATE mailboxes
          SET
              status = CASE
                  WHEN paid_at IS NULL THEN 'pending_payment'
                  WHEN expires_at IS NULL OR expires_at > CURRENT_TIMESTAMP THEN 'active'
                  ELSE 'expired'
              END,
              updated_at = CURRENT_TIMESTAMP
          WHERE status = 'suspended'
            AND billing_email <> ''
            AND (account_id IS NULL OR account_id = '');`
          func main() {
            db, err := database.OpenTurso(os.Getenv("TURSO_DATABASE_URL"), os.Getenv("TURSO_AUTH_TOKEN"))
            if err != nil { log.Fatal(err) }
            sqlDB, err := db.DB()
            if err != nil { log.Fatal(err) }
            defer sqlDB.Close()
            ctx := context.Background()

            tx, err := sqlDB.BeginTx(ctx, nil)
            if err != nil { log.Fatal(err) }
            defer tx.Rollback()

            dump := func(label string) {
              fmt.Printf("\n=== %s ===\n", label)
              rows, err := tx.QueryContext(ctx, "SELECT status, COUNT(*) FROM mailboxes GROUP BY status ORDER BY status")
              if err != nil { log.Fatal(err) }
              defer rows.Close()
              for rows.Next() {
                var s string
                var c int64
                rows.Scan(&s, &c)
                fmt.Printf("  status=%s count=%d\n", s, c)
              }
              detail, err := tx.QueryContext(ctx, "SELECT billing_email, status, paid_at IS NOT NULL, expires_at FROM mailboxes WHERE billing_email <> '' AND (account_id IS NULL OR account_id = '') ORDER BY billing_email, rowid")
              if err != nil { log.Fatal(err) }
              defer detail.Close()
              for detail.Next() {
                var email, status string
                var hasPaid bool
                var expiresAt interface{}
                detail.Scan(&email, &status, &hasPaid, &expiresAt)
                fmt.Printf("  email=%s status=%s paid=%v expires=%v\n", email, status, hasPaid, expiresAt)
              }
            }

            dump("BEFORE recovery")

            if _, err := tx.ExecContext(ctx, dropIndex); err != nil { log.Fatal("drop index exec: ", err) }
            fmt.Println("\nidx_mailboxes_billing_email_active dropped (within tx)")

            res, err := tx.ExecContext(ctx, recovery)
            if err != nil { log.Fatal("recovery exec: ", err) }
            n, _ := res.RowsAffected()
            fmt.Printf("\nrows affected by recovery: %d\n", n)

            dump("AFTER recovery (uncommitted)")

            if err := tx.Rollback(); err != nil { log.Fatal("rollback: ", err) }
            fmt.Println("\nrolled back — production data untouched")
          }
          EOF
          mkdir -p cmd/dryrun && mv /tmp/dryrun.go cmd/dryrun/main.go
          go run ./cmd/dryrun
