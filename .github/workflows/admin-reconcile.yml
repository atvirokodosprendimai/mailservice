name: Admin Reconcile Payments

# Manually trigger Open Collective reconciliation on production without
# anyone needing ADMIN_API_KEY on their machine.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Reconcile payments
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          curl -sS -X POST https://truevipaccess.com/admin/payments/reconcile \
            -H "Authorization: Bearer $ADMIN_API_KEY" \
            -w '\nHTTP %{http_code}\n'
