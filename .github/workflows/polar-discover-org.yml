name: Polar Discover Org

on:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  discover:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Probe Polar
        env:
          POLAR_TOKEN: ${{ secrets.POLAR_TOKEN }}
          POLAR_PRODUCT_ID: ${{ vars.POLAR_PRODUCT_ID }}
        run: |
          echo "=== /v1/organizations/ ==="
          curl -sS -w '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer $POLAR_TOKEN" \
            https://api.polar.sh/v1/organizations/
          echo ""
          echo "=== /v1/products/$POLAR_PRODUCT_ID ==="
          curl -sS -w '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer $POLAR_TOKEN" \
            "https://api.polar.sh/v1/products/$POLAR_PRODUCT_ID"
